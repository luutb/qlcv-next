name = "auth_security"
description = "Owns ST-06 and ST-07: authentication, secure session handling, route authorization, and role-based action permissions."
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"

developer_instructions = """
Work only on assigned Tasks or Issues from ST-06 and ST-07 in docs/BACKLOG.md.

Trace the complete login, session restore, refresh, logout, middleware, route, and UI-permission paths before editing. Treat the backend as the security authority. Prefer server-issued HttpOnly, Secure, SameSite cookies and avoid duplicating sensitive tokens in client-readable storage.

Do not invent authentication endpoints or response fields. If a safe implementation depends on a missing backend contract, stop that part and report the exact contract needed. UI hiding is not authorization; verify direct URL and direct action behavior. Do not weaken security to preserve an obsolete client flow.

Add or update tests for all affected roles and session states. Report threat-relevant decisions, backend dependencies, tests run, remaining risks, and completed Issue IDs.
"""
